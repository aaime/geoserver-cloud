load_module modules/ngx_http_js_module.so;
worker_processes auto;
# the key that signs the shared authentication cookie, read by njs/shared-auth.js
env GATEWAY_SHARED_AUTH_KEY;
events { worker_connections 4096; }
http {
  access_log off;
  include /etc/nginx/conf.d/*.conf;
}
